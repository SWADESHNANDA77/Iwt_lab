<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Sequence</title>
</head>
<body bgcolor="skyblue"  text="black">
    <script>
        function generateFibonacci(n) {
            if (n <= 0) return [];
            if (n === 1) return [0];
            if (n === 2) return [0, 1];

            let fib = [0, 1];
            for (let i = 2; i < n; i++) {
                fib.push(fib[i - 1] + fib[i - 2]);
            }
            return fib;
        }
        let sequence = generateFibonacci(10);
        document.write("Fibonacci Sequence: " + sequence.join(", "));
    </script>
</body>
</html>

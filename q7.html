<!DOCTYPE html>
<html>
<head>
<title>count</title>
</head>
<body>
<script>
var arr = [4,5,2,5,3,2,3,5,7,4,3,7];  

var counts = {};

for (var i = 0; i < arr.length; i++) {
  var num = arr[i];
  if (counts[num]) {
    counts[num]++;  
  } else {
    counts[num] = 1; 
  }
}

document.write("Array: " + arr + "<br>");
for (var key in counts) {
  document.write("Element " + key + " occurs " + counts[key] + " times<br>");
}
</script>
</body>
</html>

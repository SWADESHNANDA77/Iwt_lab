<html>

<head>
    <title>factorial</title>
    
</head>

<body bgcolor=skyblue text=black>
    <script language=JavaScript>
        function factorial(n) {
            var f = 1;
            while (n != 0) {
                f = f * n;
                n--;
            }
            return (f);
        }
        document.write("factorial value =" ,factorial(7)); 
    </script>

</body>

</html>
